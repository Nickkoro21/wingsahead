<!DOCTYPE html>
<html lang="en" data-theme="slate" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Wings Ahead &mdash; Student utilization</title>
<link rel="icon" href="assets/364mea-240.png">
<link rel="stylesheet" href="styles.css?v=20260818b">
<script>
/* Palette before first paint — no flash of the default theme on reload.
   Mirrors app.js (PALETTES / apply): same keys, same default (DEFAULT_PAL).
   DEFAULT = Slate (light) — round 2 decision; a stored choice always wins. */
(function () {
  try {
    var d = document.documentElement,
        id = localStorage.getItem("wa-palette"),
        mode = localStorage.getItem("wa-palmode");
    if (!id) { id = "slate"; mode = "light"; }
    d.setAttribute("data-theme", id);
    d.setAttribute("data-mode", mode === "dark" ? "dark" : "light");
    d.classList.add("pal-" + id);
    if (mode !== "dark") d.classList.add("light");
  } catch (e) {}
})();
</script>
</head>

  <div class="brand">
    <img class="brand-icon" src="assets/364mea-240.png" width="26" height="40"
         alt="364 MEA" onerror="this.style.display='none'">
    <div>
      <h1>Wings Ahead</h1>
      <div class="tagline">Student utilization &mdash; Wing Commander brief</div>
    </div>
