# Weekly keep-alive ping so the Supabase free project never pauses.
# Reads the project URL + anon key straight from app/config.js (both are
# public by design — the database only answers through token-checked RPCs)
# and calls the harmless keepalive() function.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 * * 1"     # every Monday 06:17 UTC
  workflow_dispatch: {}       # manual run button, e.g. after GitHub pauses cron

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping keepalive RPC
        run: |
          node -e '
            const fs = require("fs");
            eval(fs.readFileSync("app/config.js", "utf8"));
            const url = WA_CONFIG.SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/rpc/keepalive";
            fetch(url, {
              method: "POST",
              headers: {
                apikey: WA_CONFIG.SUPABASE_ANON_KEY,
                Authorization: "Bearer " + WA_CONFIG.SUPABASE_ANON_KEY,
                "Content-Type": "application/json",
              },
              body: "{}",
            }).then((r) => r.text().then((t) => {
              console.log("keepalive:", r.status, t);
              if (!r.ok) process.exit(1);
            })).catch((e) => { console.error(e); process.exit(1); });
          '
